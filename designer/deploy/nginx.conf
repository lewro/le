# nginx site for LE Designer. The app has no login of its own: keep it behind basic auth (or your VPN/SSO).
#   sudo htpasswd -c /etc/nginx/.le-designer-htpasswd roman
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/le-designer && sudo ln -s ../sites-available/le-designer /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d design.example.com
server {
    listen 80;
    server_name design.example.com;

    auth_basic "LE Designer";
    auth_basic_user_file /etc/nginx/.le-designer-htpasswd;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-sent events (live reload) must not be buffered
    location /api/events {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
